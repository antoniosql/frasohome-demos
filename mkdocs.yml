site_name: FraSoHome · demos
site_description: La historia de FraSoHome, una cadena ficticia de muebles y decoración, y los recursos para ejecutar cada una de sus demos de datos e IA.
site_author: Antonio Soto
site_url: https://antoniosql.github.io/frasohome-demos/
repo_url: https://github.com/antoniosql/frasohome-demos
repo_name: antoniosql/frasohome-demos
edit_uri: edit/main/
copyright: Caso ficticio con datos sintéticos · MIT · Antonio Soto

# El repositorio entero es el sitio: los README.md de cada carpeta son sus páginas
# y los CSV, notebooks, scripts y diagramas se publican como descargas.
docs_dir: .
site_dir: site

exclude_docs: |
  /site/
  /.agent/
  /.local/
  /requirements*.txt
  **/output_*/
  /escenarios/05-marketing-precision/outputs/
  /escenarios/11-web-transaccional/app/
  __pycache__/

not_in_nav: |
  /datos/marketing_precision/raw_csv/README.md
  /escenarios/08-fabric-iq-ontologia/fabric/agent/instructions.md

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  language: es
  icon:
    logo: material/sofa-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - same-dir
  - search:
      lang: es

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
      # Slugs como los de GitHub (conservan tildes), para que los anclajes funcionen igual en ambos sitios
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

